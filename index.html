<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayush Thoniparambil Saseendran | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #ffffff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px;
      flex-wrap: wrap;
    }
    .header-content {
      display: flex;
      align-items: center;
    }
    .text h1 {
      font-size: 40px;
      margin: 0;
    }
    .typing {
      font-size: 18px;
      color: #58a6ff;
      margin-top: 10px;
    }
    .profile-pic img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-left: 30px;
      border: 3px solid #58a6ff;
    }
    .github-button {
      padding: 10px 20px;
      background-color: #58a6ff;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
    section {
      padding: 40px;
    }
    h2 {
      color: #58a6ff;
      margin-bottom: 20px;
    }
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .skill-card {
      background: #1f2937;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      width: 120px;
    }
    .skill-card img {
      width: 50px;
      height: 50px;
    }
    .timeline {
      border-left: 3px solid #58a6ff;
      padding-left: 20px;
    }
    .timeline-item {
      margin-bottom: 30px;
      position: relative;
    }
    .timeline-item::before {
      content: '';
      width: 15px;
      height: 15px;
      background: #58a6ff;
      border-radius: 50%;
      position: absolute;
      left: -30px;
      top: 0;
    }
    .projects-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .project-card {
      background: #1f2937;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      text-align: center;
      cursor: pointer;
    }
    .project-card:hover {
      background: #374151;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #0f2027;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
    }
    .modal-content {
      background: #1f2937;
      margin: 15% auto;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      color: white;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }
    .close:hover,
    .close:focus {
      color: #fff;
      cursor: pointer;
    }
  </style>
  <script>
    const texts = ['Data Engineer', 'Cloud Enthusiast', 'Applied Data Science Graduate'];
    let count = 0;
    let index = 0;
    let currentText = '';
    let letter = '';
    (function type() {
      if (count === texts.length) {
        count = 0;
      }
      currentText = texts[count];
      letter = currentText.slice(0, ++index);
      document.getElementById('typing').textContent = letter;
      if (letter.length === currentText.length) {
        count++;
        index = 0;
        setTimeout(type, 1000);
      } else {
        setTimeout(type, 150);
      }
    })();
    function openModal(title, description) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-description').innerText = description;
      document.getElementById('modal').style.display = 'block';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</head>
